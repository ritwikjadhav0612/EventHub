
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful - EventHub</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">EventHub</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
        </div>
    </nav>

    <main class="events-page">
        <div class="event-card success-card">

            <div class="success-icon">&#10003;</div>

            <h1>Registration Successful!</h1>

            <div id="registrationSummary" style="margin: 15px 0; font-size: 15px; color: #333;">
                <p>
                    Congratulations! You have successfully registered
                    for the event.
                </p>
                <p>Thank you for choosing EventHub.</p>
            </div>

            <a href="events.html" class="event-button">
                Explore More Events
            </a>

        </div>
    </main>

    <script>
        try {
            const lastReg = JSON.parse(localStorage.getItem("eventhub_last_registration"));
            if (lastReg && lastReg.name) {
                const summaryDiv = document.getElementById("registrationSummary");
                summaryDiv.innerHTML = `
                    <p style="font-size: 17px; font-weight: bold; color: #1557a6;">
                        Welcome, ${lastReg.name}!
                    </p>
                    <p>
                        You are successfully registered for <strong>${lastReg.eventName || 'your event'}</strong>.
                    </p>
                    <p style="color: #666; font-size: 13px;">
                        Department: ${lastReg.department?.toUpperCase() || ''} | Year: Year ${lastReg.year || ''}
                    </p>
                `;
            }
        } catch (e) {
            console.log("No stored registration found.");
        }
    </script>
</body>
</html>
